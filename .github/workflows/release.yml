name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  # Never cancelled: a run that is part-way through publishing must finish. Two
  # pushes to main queue instead, which is the correct order for a release.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')
    outputs:
      version: ${{ steps.version.outputs.version }}

    # The commit being published is tested against every backend it supports,
    # not two of the three. The suites run where `REDIS_URL` names a server and
    # skip where none is named, so without this the release would publish code
    # whose Redis paths nothing had run since the pull request.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install root dependencies
        run: npm ci

      - name: Install dashboard dependencies
        run: npm ci
        working-directory: dashboard

      - name: Run tests
        run: npm test
        env:
          REDIS_URL: redis://127.0.0.1:6379

      - name: Build
        run: npm run build

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      # semantic-release writes the released version into package.json before
      # publishing, so this is the version that just went out — or, when nothing
      # was released, the one already on npm, which is still worth checking.
      - name: Read the released version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  # Everything above tests the source tree. This installs what npm actually
  # serves into an empty project and opens it — the check that was done by hand
  # after 0.8.0 shipped a dashboard that was blank in a browser while every
  # suite passed.
  smoke:
    name: Smoke test the published package
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install ${{ needs.release.outputs.version }} from npm and boot it
        run: node scripts/smoke-published-package.mjs ${{ needs.release.outputs.version }}
