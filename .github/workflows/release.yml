name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  # Never cancelled: a run that is part-way through publishing must finish. Two
  # pushes to main queue instead, which is the correct order for a release.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')
    outputs:
      version: ${{ steps.version.outputs.version }}

    # The commit being published is tested against every backend it supports,
    # not two of the three. The suites run where `REDIS_URL` names a server and
    # skip where none is named, so without this the release would publish code
    # whose Redis paths nothing had run since the pull request.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          node-version: 22
          cache: true
          registry-url: 'https://registry.npmjs.org'

      - name: Install root dependencies
        run: npm ci

      - name: Install dashboard dependencies
        run: npm ci
        working-directory: dashboard

      # Build first: the suites that serve the built dashboard skip themselves
      # when dist/dashboard/public/index.html is missing, as ci.yml explains.
      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test
        env:
          REDIS_URL: redis://127.0.0.1:6379

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      # semantic-release writes the released version into package.json before
      # publishing, so this is the version that just went out — or, when nothing
      # was released, the one already on npm, which is still worth checking.
      - name: Read the released version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  # Everything above tests the source tree. This installs what npm actually
  # serves into an empty project and opens it — the check that was done by hand
  # after 0.8.0 shipped a dashboard that was blank in a browser while every
  # suite passed.
  #
  # It runs on the exact floor `engines` names and on the newest line the
  # compatibility matrix tests.
  # On the floor alone it passed a package whose optional better-sqlite3 had no
  # binary for Node 26 and did not compile there, so npm dropped it and the
  # SQLite entry point failed to load. The script only reads the registry and
  # installs into a temporary directory, so the two jobs share nothing; each
  # waits for the version on its own.
  smoke:
    name: Smoke test the published package on Node ${{ matrix.node }}
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node: [22.13.0, 26]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ matrix.node }}

      - name: Install ${{ needs.release.outputs.version }} from npm and boot it
        run: node scripts/smoke-published-package.mjs ${{ needs.release.outputs.version }}
