name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  # A newer push to the same branch makes the previous run's answer irrelevant,
  # and on a shared runner pool the superseded run is what the new one queues
  # behind. Cancelling it is the difference between minutes and half an hour.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every job below carries a timeout. Without one GitHub allows six hours, so a
  # `npm test` that hangs bills 360 minutes rather than failing: seventeen such
  # jobs took 6,120 of this account's 6,855 Actions minutes in one month and
  # queued every other repository behind them. The suites take two to three
  # minutes; fifteen is room to spare and still fails fast.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install dashboard dependencies
        run: npm ci
        working-directory: dashboard

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run library tests
        run: npm test

      # The dashboard is half of what ships and had no static analysis at all:
      # the lint step above covers `src/**/*.ts`, and the type check runs
      # against the library's tsconfig. A type error or a broken hook here
      # reached a release with CI green.
      - name: Lint dashboard
        run: npm run lint
        working-directory: dashboard

      - name: Type check dashboard
        run: npx tsc --noEmit
        working-directory: dashboard

      - name: Run dashboard tests
        run: npx vitest run
        working-directory: dashboard

  # package.json promises NestJS 9/10/11 on Node >= 18. Until this matrix
  # existed the promise was only ever exercised on one of those combinations,
  # so a peer range that had quietly stopped being true would have shipped
  # unnoticed.
  compatibility:
    name: NestJS ${{ matrix.nestjs }} on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        nestjs: [9, 10, 11]
        # The Node versions still receiving security updates. 18 was dropped
        # once it went end-of-life: testing a runtime nobody should be running
        # costs a third of this matrix and proves nothing about the ones people
        # are. 24 has been LTS since October 2025 and was untested until now.
        node: [20, 22, 24]
        include:
          # Companion packages have their own peer ranges, so each NestJS
          # version is paired with the release an application on that version
          # would actually install.
          - nestjs: 9
            schedule: 3
          - nestjs: 10
            schedule: 4
          - nestjs: 11
            schedule: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Pin NestJS to ${{ matrix.nestjs }}
        run: |
          npm install --no-save --legacy-peer-deps --no-audit --no-fund \
            @nestjs/common@${{ matrix.nestjs }} \
            @nestjs/core@${{ matrix.nestjs }} \
            @nestjs/platform-express@${{ matrix.nestjs }} \
            @nestjs/platform-fastify@${{ matrix.nestjs }} \
            @nestjs/testing@${{ matrix.nestjs }} \
            @nestjs/schedule@${{ matrix.schedule }}

      # Installing a companion package can drag NestJS back up through peer
      # resolution, which would quietly test the wrong version.
      - name: Report resolved versions
        run: |
          node -e "for (const m of ['@nestjs/core','@nestjs/common','@nestjs/platform-fastify','@nestjs/schedule']) \
            console.log(m, require(m + '/package.json').version)"
          node -e "const major = require('@nestjs/core/package.json').version.split('.')[0]; \
            if (major !== '${{ matrix.nestjs }}') { \
              console.error('Expected NestJS ${{ matrix.nestjs }}, resolved ' + major); process.exit(1); }"

      - name: Run library tests
        run: npm test
