name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install dashboard dependencies
        run: npm ci
        working-directory: dashboard

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run library tests
        run: npm test

      - name: Run dashboard tests
        run: npx vitest run
        working-directory: dashboard

  # package.json promises NestJS 9/10/11 on Node >= 18. Until this matrix
  # existed the promise was only ever exercised on one of those combinations,
  # so a peer range that had quietly stopped being true would have shipped
  # unnoticed.
  compatibility:
    name: NestJS ${{ matrix.nestjs }} on Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        nestjs: [9, 10, 11]
        node: [18, 20, 22]
        exclude:
          # NestJS 11 requires Node >= 20.
          - nestjs: 11
            node: 18

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Pin NestJS to ${{ matrix.nestjs }}
        run: |
          npm install --no-save --legacy-peer-deps --no-audit --no-fund \
            @nestjs/common@${{ matrix.nestjs }} \
            @nestjs/core@${{ matrix.nestjs }} \
            @nestjs/platform-express@${{ matrix.nestjs }} \
            @nestjs/platform-fastify@${{ matrix.nestjs }} \
            @nestjs/testing@${{ matrix.nestjs }}

      - name: Report resolved versions
        run: |
          node -e "for (const m of ['@nestjs/core','@nestjs/common','@nestjs/platform-fastify']) \
            console.log(m, require(m + '/package.json').version)"

      - name: Run library tests
        run: npm test
