name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  # A newer push to the same branch makes the previous run's answer irrelevant,
  # and on a shared runner pool the superseded run is what the new one queues
  # behind. Cancelling it is the difference between minutes and half an hour.
  group: ci-${{ github.ref }}
  # Off for pull requests from forks, because there the ordering this depends on
  # does not hold. GitHub cancels whichever run is *already going* when another
  # one starts — which matches commit order only while runs start in the order
  # they were created. Runs from a fork wait for a maintainer to approve them,
  # and approval sets the start order instead: on #62 the run for the older
  # commit was approved after the newer commit's run had begun, started twelve
  # seconds later, and cancelled it. Both ended cancelled and the checks had to
  # be started by hand.
  #
  # Nothing unsafe came of it — checks belong to the commit they ran on, so a
  # stale run can never show green against the head — but the way out is to stop
  # cancelling exactly where the assumption fails. Two pushes to a fork branch
  # can now cost two matrices; two pushes to a branch here still cost one, which
  # is where the pushes actually are.
  cancel-in-progress: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  # Every job below carries a timeout. Without one GitHub allows six hours, so a
  # `npm test` that hangs bills 360 minutes rather than failing: seventeen such
  # jobs took 6,120 of this account's 6,855 Actions minutes in one month and
  # queued every other repository behind them. The suites take two to three
  # minutes; fifteen is room to spare and still fails fast.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Redis is a supported storage backend whose tests were written against a
    # mock, so they agreed with the implementation rather than checking it: tag
    # counts drifted on every path — `ALPHA:2` for one entry, `NEVER:-1` for a
    # tag that never existed — and every mocked test passed throughout. The
    # parity suite runs against this and compares the three backends' answers.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          node-version: 22
          cache: true

      - name: Install root dependencies
        run: npm ci

      - name: Install dashboard dependencies
        run: npm ci
        working-directory: dashboard

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      # Playwright strips types without checking them, and the library's
      # tsconfig covers src/ only, so a type error in a Playwright spec was
      # visible to nobody. The lint step above parses them with this config.
      - name: Type check E2E specs
        run: npx tsc -p e2e

      # Five integration suites serve the real bundle and skip themselves when
      # it is not on disk. Without this step they skipped in CI and nowhere
      # else: 54 tests, covering the dashboard arriving as HTML rather than as
      # a JSON string, SPA routes, asset compression and adapter differences —
      # which is the exact failure that shipped in 0.8.0 with every suite green.
      - name: Build
        run: npm run build

      - name: Run library tests
        run: npm test
        env:
          REDIS_URL: redis://127.0.0.1:6379

      # The dependencies a consumer actually receives, and only those.
      #
      # GitHub's alert count mixes everything in the repository together —
      # Docusaurus's build graph, semantic-release's tree, the demo application
      # — so it can read in the dozens while the published package is clean, and
      # a real advisory in `class-validator` would arrive looking exactly like
      # the rest. `--omit=dev` asks the only question that affects somebody
      # installing NestLens: is anything in what they receive vulnerable?
      - name: Audit what the package ships
        run: npm audit --omit=dev --audit-level=high

      # The dashboard is half of what ships and had no static analysis at all:
      # the lint step above covers `src/**/*.ts`, and the type check runs
      # against the library's tsconfig. A type error or a broken hook here
      # reached a release with CI green.
      - name: Lint dashboard
        run: npm run lint
        working-directory: dashboard

      # Two projects: the app, and vite.config.ts on its own tsconfig. A plain
      # `tsc` never reached the second, and it stopped type-checking unnoticed.
      - name: Type check dashboard
        run: npm run typecheck
        working-directory: dashboard

      - name: Run dashboard tests
        run: npx vitest run
        working-directory: dashboard

  # package.json promises NestJS 9/10/11/12. Until this matrix existed the
  # promise was only ever exercised on one of those combinations, so a peer
  # range that had quietly stopped being true would have shipped unnoticed.
  #
  # NestJS 12 is ESM only. NestLens stays CommonJS and loads it through
  # require(esm), which Node enables from 22.12 and stops warning about at
  # every boot from 22.13 — the floor `engines` names. `node: 22` resolves to
  # the newest 22.x, so the floor itself runs in a row of its own below.
  # The suite runs on Vitest, which hands `node_modules` to Node's own loader,
  # so the tests load NestJS the way an application does.
  compatibility:
    name: NestJS ${{ matrix.nestjs }} on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        nestjs: [9, 10, 11, 12]
        # The LTS lines still receiving security updates. A line leaves in the
        # first NestLens minor after its end-of-life, as the versioning page
        # promises: 18 left that way, and 20 — end-of-life on 30 April 2026 —
        # was still here eight minors later, while 26, LTS since 28 October
        # 2026, was never run. The floor must equal `engines`; the
        # package-contract spec fails the build when they part.
        node: [22, 24, 26]
        include:
          # Companion packages have their own peer ranges, so each NestJS
          # version is paired with the release an application on that version
          # would actually install.
          #
          # Mercurius is here for the same reason and a sharper one: NestJS 9
          # and 10 bring Fastify 4, and Mercurius has needed Fastify 5 since
          # its 15.0.0. The repository's own dependency is 16, so on those rows
          # the GraphQL suites met `expected '5.x' fastify version, '4.28.1' is
          # installed` and six of the nine jobs failed on a pairing no
          # application would ever have. 14 is the last release that runs on
          # Fastify 4, which is what an application on NestJS 9 or 10 installs.
          # Schedule 4, not 3: its 3.x calls `util.isString`, which Node removed
          # in 23, so the decorator itself throws on the Node 24 row —
          # `TypeError: (0 , util_1.isString) is not a function` before a test
          # runs. 4 is also what npm installs for an application on NestJS 9
          # today, since 5 requires NestJS 10.
          #
          # The repository's own devDependencies are on the NestJS 12 line, and
          # so are their companions: `@nestjs/graphql`, `@nestjs/apollo` and
          # `@nestjs/mercurius` 14 require NestJS 12 outright. Every row pins
          # the newest release whose peer range admits its NestJS, read from
          # `npm view <package>@<major> peerDependencies`:
          #
          #   graphql — `@nestjs/graphql`, `@nestjs/apollo`, `@nestjs/mercurius`:
          #     12 for NestJS 9 and 10, 13 for 11, 14 for 12. 12 is also the
          #     last line on Apollo Server 4 and Fastify 4.
          #   apollo-server — `@apollo/server`: `@nestjs/apollo` 12 wants 4,
          #     13 and 14 want 5.
          #   typeorm — `@nestjs/typeorm`: 10 is the last to admit NestJS 9,
          #     12 admits 10 to 12.
          #   axios — `@nestjs/axios`: 3 is the last to admit NestJS 9, 12
          #     admits 10 to 12.
          #   schedule — `@nestjs/schedule`: 6 is the last for NestJS 10, 12
          #     admits 11 and 12.
          #   cache-manager — `@nestjs/cache-manager` 12 admits NestJS 9 to 12,
          #     so every application installs it. It is ESM only, which is
          #     worth knowing on the NestJS 9 to 11 rows.
          - nestjs: 9
            schedule: 4
            mercurius: 14
            graphql: 12
            apollo-server: 4
            typeorm: 10
            axios: 3
            cache-manager: 12
          - nestjs: 10
            schedule: 6
            mercurius: 14
            graphql: 12
            apollo-server: 4
            typeorm: 12
            axios: 12
            cache-manager: 12
          - nestjs: 11
            schedule: 12
            mercurius: 16
            graphql: 13
            apollo-server: 5
            typeorm: 12
            axios: 12
            cache-manager: 12
          - nestjs: 12
            schedule: 12
            mercurius: 16
            graphql: 14
            apollo-server: 5
            typeorm: 12
            axios: 12
            cache-manager: 12
          # The exact floor `engines` names, which `node: 22` never selects. A
          # Node that is not on the axis makes a job of its own carrying only
          # the keys written here, so the NestJS 12 companions are repeated in
          # full; the package-contract spec checks the two rows agree. NestJS
          # 12 because it is the line that needs require(esm) to load at all.
          - nestjs: 12
            node: 22.13.0
            schedule: 12
            mercurius: 16
            graphql: 14
            apollo-server: 5
            typeorm: 12
            axios: 12
            cache-manager: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The row's Node is the runtime under test; npm is the pinned one on
      # every row, so all three install from the lockfile the same way.
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install dashboard dependencies
        run: npm ci
        working-directory: dashboard

      # The same reason as in the unit-test job: five integration suites serve
      # the real bundle and skip without it. Here that included the Express 4
      # deep-link test, which only the NestJS 9 and 10 rows can run — so the one
      # place able to catch `*path` mounted on an Express 4 router never ran it.
      # Built before the pin, against the devDependencies, because that is the
      # build that ships.
      - name: Build
        run: npm run build

      - name: Pin NestJS to ${{ matrix.nestjs }}
        run: |
          npm install --no-save --legacy-peer-deps --no-audit --no-fund \
            @nestjs/common@${{ matrix.nestjs }} \
            @nestjs/core@${{ matrix.nestjs }} \
            @nestjs/platform-express@${{ matrix.nestjs }} \
            @nestjs/platform-fastify@${{ matrix.nestjs }} \
            @nestjs/testing@${{ matrix.nestjs }} \
            @nestjs/schedule@${{ matrix.schedule }} \
            @nestjs/graphql@${{ matrix.graphql }} \
            @nestjs/apollo@${{ matrix.graphql }} \
            @nestjs/mercurius@${{ matrix.graphql }} \
            @apollo/server@${{ matrix.apollo-server }} \
            @nestjs/typeorm@${{ matrix.typeorm }} \
            @nestjs/axios@${{ matrix.axios }} \
            @nestjs/cache-manager@${{ matrix.cache-manager }} \
            mercurius@${{ matrix.mercurius }}

      # Installing a companion package can drag NestJS back up through peer
      # resolution, which would quietly test the wrong version — and with the
      # devDependencies on the NestJS 12 line, a companion left unpinned would
      # quietly test one that requires a NestJS the row does not have. Every
      # package pinned above is read back from node_modules, which is what the
      # suite loads.
      - name: Report resolved versions
        env:
          EXPECTED: >-
            {
            "@nestjs/common": "${{ matrix.nestjs }}",
            "@nestjs/core": "${{ matrix.nestjs }}",
            "@nestjs/platform-express": "${{ matrix.nestjs }}",
            "@nestjs/platform-fastify": "${{ matrix.nestjs }}",
            "@nestjs/testing": "${{ matrix.nestjs }}",
            "@nestjs/schedule": "${{ matrix.schedule }}",
            "@nestjs/graphql": "${{ matrix.graphql }}",
            "@nestjs/apollo": "${{ matrix.graphql }}",
            "@nestjs/mercurius": "${{ matrix.graphql }}",
            "@apollo/server": "${{ matrix.apollo-server }}",
            "@nestjs/typeorm": "${{ matrix.typeorm }}",
            "@nestjs/axios": "${{ matrix.axios }}",
            "@nestjs/cache-manager": "${{ matrix.cache-manager }}",
            "mercurius": "${{ matrix.mercurius }}"
            }
        run: |
          node -e "
            const { readFileSync } = require('node:fs');
            const expected = JSON.parse(process.env.EXPECTED);
            let wrong = 0;
            for (const [name, major] of Object.entries(expected)) {
              const { version } = JSON.parse(readFileSync('node_modules/' + name + '/package.json', 'utf8'));
              const ok = version.split('.')[0] === major;
              console.log((ok ? '  ' : '✗ ') + name + ' ' + version + (ok ? '' : ' (expected ' + major + '.x)'));
              if (!ok) wrong++;
            }
            if (wrong) { console.error(wrong + ' package(s) resolved to the wrong line'); process.exit(1); }
          "

      - name: Run library tests
        run: npm test

  # The documentation site is part of what ships — every change is supposed to
  # arrive with its docs — and nothing here built it: a broken build surfaced as
  # a failed Vercel deployment after the fact. It also fails on a broken link,
  # which is how a moved page gets caught.
  docs:
    name: Documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The Node Vercel deploys with, not the floor. docs/package.json asks for
      # `>=22.13.0`, and Vercel maps an open range to the newest LTS it offers
      # (26 today) — so building on 22 checked a runtime the deployment never
      # uses. `lts/*` follows Vercel as new lines arrive; the two can differ
      # only in the weeks before Vercel adds a new LTS.
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          node-version: lts/*
          cache: true

      # The API reference is generated from `src/` by typedoc. Without the
      # library's own dependencies it cannot resolve a single import, produces
      # nothing, and the build fails on the links into it.
      - name: Install library dependencies
        run: npm ci --ignore-scripts

      - name: Install documentation dependencies
        run: npm ci
        working-directory: docs

      - name: Build
        run: npm run build
        working-directory: docs
