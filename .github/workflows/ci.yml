name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  # A newer push to the same branch makes the previous run's answer irrelevant,
  # and on a shared runner pool the superseded run is what the new one queues
  # behind. Cancelling it is the difference between minutes and half an hour.
  group: ci-${{ github.ref }}
  # Off for pull requests from forks, because there the ordering this depends on
  # does not hold. GitHub cancels whichever run is *already going* when another
  # one starts — which matches commit order only while runs start in the order
  # they were created. Runs from a fork wait for a maintainer to approve them,
  # and approval sets the start order instead: on #62 the run for the older
  # commit was approved after the newer commit's run had begun, started twelve
  # seconds later, and cancelled it. Both ended cancelled and the checks had to
  # be started by hand.
  #
  # Nothing unsafe came of it — checks belong to the commit they ran on, so a
  # stale run can never show green against the head — but the way out is to stop
  # cancelling exactly where the assumption fails. Two pushes to a fork branch
  # can now cost two matrices; two pushes to a branch here still cost one, which
  # is where the pushes actually are.
  cancel-in-progress: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  # Every job below carries a timeout. Without one GitHub allows six hours, so a
  # `npm test` that hangs bills 360 minutes rather than failing: seventeen such
  # jobs took 6,120 of this account's 6,855 Actions minutes in one month and
  # queued every other repository behind them. The suites take two to three
  # minutes; fifteen is room to spare and still fails fast.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Redis is a supported storage backend whose tests were written against a
    # mock, so they agreed with the implementation rather than checking it: tag
    # counts drifted on every path — `ALPHA:2` for one entry, `NEVER:-1` for a
    # tag that never existed — and every mocked test passed throughout. The
    # parity suite runs against this and compares the three backends' answers.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install dashboard dependencies
        run: npm ci
        working-directory: dashboard

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      # Five integration suites serve the real bundle and skip themselves when
      # it is not on disk. Without this step they skipped in CI and nowhere
      # else: 54 tests, covering the dashboard arriving as HTML rather than as
      # a JSON string, SPA routes, asset compression and adapter differences —
      # which is the exact failure that shipped in 0.8.0 with every suite green.
      - name: Build
        run: npm run build

      - name: Run library tests
        run: npm test
        env:
          REDIS_URL: redis://127.0.0.1:6379

      # The dependencies a consumer actually receives, and only those.
      #
      # GitHub's alert count mixes everything in the repository together —
      # Docusaurus's build graph, semantic-release's tree, the demo application
      # — so it can read in the dozens while the published package is clean, and
      # a real advisory in `class-validator` would arrive looking exactly like
      # the rest. `--omit=dev` asks the only question that affects somebody
      # installing NestLens: is anything in what they receive vulnerable?
      - name: Audit what the package ships
        run: npm audit --omit=dev --audit-level=high

      # The dashboard is half of what ships and had no static analysis at all:
      # the lint step above covers `src/**/*.ts`, and the type check runs
      # against the library's tsconfig. A type error or a broken hook here
      # reached a release with CI green.
      - name: Lint dashboard
        run: npm run lint
        working-directory: dashboard

      - name: Type check dashboard
        run: npx tsc --noEmit
        working-directory: dashboard

      - name: Run dashboard tests
        run: npx vitest run
        working-directory: dashboard

  # package.json promises NestJS 9/10/11 on Node >= 18. Until this matrix
  # existed the promise was only ever exercised on one of those combinations,
  # so a peer range that had quietly stopped being true would have shipped
  # unnoticed.
  compatibility:
    name: NestJS ${{ matrix.nestjs }} on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        nestjs: [9, 10, 11]
        # The Node versions still receiving security updates. 18 was dropped
        # once it went end-of-life: testing a runtime nobody should be running
        # costs a third of this matrix and proves nothing about the ones people
        # are. 24 has been LTS since October 2025 and was untested until now.
        node: [20, 22, 24]
        include:
          # Companion packages have their own peer ranges, so each NestJS
          # version is paired with the release an application on that version
          # would actually install.
          #
          # Mercurius is here for the same reason and a sharper one: NestJS 9
          # and 10 bring Fastify 4, and Mercurius has needed Fastify 5 since
          # its 15.0.0. The repository's own dependency is 16, so on those rows
          # the GraphQL suites met `expected '5.x' fastify version, '4.28.1' is
          # installed` and six of the nine jobs failed on a pairing no
          # application would ever have. 14 is the last release that runs on
          # Fastify 4, which is what an application on NestJS 9 or 10 installs.
          # Schedule 4, not 3: its 3.x calls `util.isString`, which Node removed
          # in 23, so the decorator itself throws on the Node 24 row —
          # `TypeError: (0 , util_1.isString) is not a function` before a test
          # runs. 4 is also what npm installs for an application on NestJS 9
          # today, since 5 requires NestJS 10.
          - nestjs: 9
            schedule: 4
            mercurius: 14
          - nestjs: 10
            schedule: 4
            mercurius: 14
          - nestjs: 11
            schedule: 6
            mercurius: 16

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Pin NestJS to ${{ matrix.nestjs }}
        run: |
          npm install --no-save --legacy-peer-deps --no-audit --no-fund \
            @nestjs/common@${{ matrix.nestjs }} \
            @nestjs/core@${{ matrix.nestjs }} \
            @nestjs/platform-express@${{ matrix.nestjs }} \
            @nestjs/platform-fastify@${{ matrix.nestjs }} \
            @nestjs/testing@${{ matrix.nestjs }} \
            @nestjs/schedule@${{ matrix.schedule }} \
            mercurius@${{ matrix.mercurius }}

      # Installing a companion package can drag NestJS back up through peer
      # resolution, which would quietly test the wrong version.
      - name: Report resolved versions
        run: |
          node -e "for (const m of ['@nestjs/core','@nestjs/common','@nestjs/platform-fastify','@nestjs/schedule']) \
            console.log(m, require(m + '/package.json').version)"
          node -e "const major = require('@nestjs/core/package.json').version.split('.')[0]; \
            if (major !== '${{ matrix.nestjs }}') { \
              console.error('Expected NestJS ${{ matrix.nestjs }}, resolved ' + major); process.exit(1); }"

      - name: Run library tests
        run: npm test

  # The documentation site is part of what ships — every change is supposed to
  # arrive with its docs — and nothing here built it: a broken build surfaced as
  # a failed Vercel deployment after the fact. It also fails on a broken link,
  # which is how a moved page gets caught.
  docs:
    name: Documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json

      # The API reference is generated from `src/` by typedoc. Without the
      # library's own dependencies it cannot resolve a single import, produces
      # nothing, and the build fails on the links into it.
      - name: Install library dependencies
        run: npm ci --ignore-scripts

      - name: Install documentation dependencies
        run: npm ci
        working-directory: docs

      - name: Build
        run: npm run build
        working-directory: docs
