name: Dependabot auto-merge

# Security updates merge themselves, once the tests say they can.
#
# Only security updates reach this workflow: `dependabot.yml` sets
# `open-pull-requests-limit: 0`, which switches version updates off and leaves
# security updates on, so Dependabot opens a pull request when an advisory is
# published against something this package depends on and at no other time. Those are rare, they matter, and waiting for a human to press a
# button is the slowest part of shipping the fix.
#
# What makes it safe is not that Dependabot is trustworthy — a security fix can
# arrive as a major version with breaking changes — but that this waits for the
# checks and merges nothing until they are green: the unit suite, the NestJS
# 9/10/11 × Node 20/22/24 matrix, the documentation build and CodeQL. A bump
# that breaks any of them stays in the pull request, waiting to be looked at.
#
# The waiting is done here rather than by branch protection on purpose. Required
# checks on `main` apply to direct pushes too, and semantic-release pushes the
# release commit itself — protecting the branch blocked the release instead of
# the bot. On a personal repository there is no way to grant Actions a bypass,
# so the gate lives where only pull requests pass through.
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.actor == 'dependabot[bot]'

    steps:
      # Says what kind of update this is, so the log explains any future
      # decision to treat some of them differently.
      - name: Read the update
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for the checks, then merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Update type: ${{ steps.metadata.outputs.update-type }}"
          echo "Dependencies: ${{ steps.metadata.outputs.dependency-names }}"

          # Polled rather than `gh pr checks --watch`, which waits on every check
          # including this job — so it waited for itself and timed out forty-five
          # minutes later. This one skips its own name.
          for attempt in $(seq 1 60); do
            runs=$(gh api "repos/${{ github.repository }}/commits/$HEAD_SHA/check-runs" \
              --jq '[.check_runs[] | select(.name != "Enable auto-merge")]')

            total=$(echo "$runs" | jq 'length')
            done_count=$(echo "$runs" | jq '[.[] | select(.status == "completed")] | length')
            failed=$(echo "$runs" | jq -r '[.[] | select(.conclusion != null and .conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral") | .name] | join(", ")')

            if [ -n "$failed" ]; then
              echo "Not merging — failed: $failed"
              exit 1
            fi

            if [ "$total" -gt 0 ] && [ "$total" = "$done_count" ]; then
              echo "All $total checks passed."
              gh pr merge --merge "$PR_URL"
              exit 0
            fi

            echo "$done_count/$total complete, waiting ($attempt/60)"
            sleep 30
          done

          echo "Checks did not finish in thirty minutes; leaving the pull request open."
          exit 1
